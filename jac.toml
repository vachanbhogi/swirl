[project]
name = "swirl"
version = "0.1.0"
description = "Swirl local-first Jac graph-walker runtime"
entry-point = "main.jac"
kind = "web-app"
jac-version = "==0.34.7"

[dependencies]

[dependencies.npm]
"@tauri-apps/api" = "^2.11.1"
lucide-react = "^1.27.0"
react = "^19.2.7"
react-dom = "^19.2.7"

[dependencies.npm.dev]
"@tailwindcss/vite" = "^4.1.18"
tailwindcss = "^4.1.18"

[byllm.model]
default_model = "nvidia_nim/meta/llama-3.3-70b-instruct"

[serve]
base_route_app = "app"

[client.app_meta_data]
title = "Swirl"
description = "Local-first visual workflows powered by Jac"
theme_color = "#000000"
icon = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgcng9IjgiIHdpZHRoPSIzMiIgaGVpZ2h0PSIzMiIgZmlsbD0iIzA5MDkwYiIvPjxwYXRoIGQ9Ik0yMCAzIDggMThoOGwtNCAxMSAxMi0xNWgtOHoiIGZpbGw9IiNmZmYiLz48L3N2Zz4"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[dev-dependencies]
watchdog = ">=3.0.0"
